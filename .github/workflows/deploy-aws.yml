name: deploy-aws

# Despliega backend + celery a ECS y frontend a S3+CloudFront.
# Requiere previa aplicacion de infra/terraform/ y los siguientes secrets:
#   AWS_DEPLOY_ROLE_ARN   - output github_actions_role_arn de Terraform
#   AWS_REGION            - region (ej. us-east-1)
#   ECS_CLUSTER           - output ecs_cluster_name
#   FRONTEND_BUCKET       - output frontend_bucket
#   CLOUDFRONT_DIST_ID    - output cloudfront_distribution_id
#   API_BASE_URL          - https://api.dominio/api/v1

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-aws.yml'

permissions:
  id-token: write   # OIDC
  contents: read

env:
  APP_VERSION: v1.3.0

jobs:
  build-and-push:
    name: Build + Push ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            target: backend
          - image: celery
            context: ./backend
            target: celery
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/cacaoscan-prod-${{ matrix.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/cacaoscan-prod-${{ matrix.image }}:latest
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            INSTALL_TRAIN_DEPS=false
          cache-from: type=gha,scope=${{ matrix.image }}-prod
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-prod

  deploy-backend:
    name: Deploy backend (ECS)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update ECS services (rolling)
        run: |
          for svc in backend celery-worker celery-beat; do
            aws ecs update-service \
              --cluster "${{ secrets.ECS_CLUSTER }}" \
              --service "$svc" \
              --force-new-deployment \
              --no-cli-pager
          done

      - name: Wait for stable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services backend celery-worker celery-beat

  deploy-frontend:
    name: Deploy frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install + build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ secrets.FRONTEND_BUCKET }}/" \
            --delete --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html "s3://${{ secrets.FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DIST_ID }}" \
            --paths "/*"
